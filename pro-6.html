6.image map


<!DOCTYPE html>
<html>
<head>
    <title>Image Map</title>
</head>
<body>

<h2>HTML Image Map</h2>

<img src="https://www.w3schools.com/html/workplace.jpg"
     usemap="#mymap" width="400" height="300">

<map name="mymap">
    <area shape="rect" coords="34,44,270,350"
          href="https://www.google.com" alt="Computer">

    <area shape="circle" coords="337,300,44"
          href="https://www.w3schools.com" alt="Coffee">
</map>

</body>
</html>
