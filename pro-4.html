<!DOCTYPE html>
<html>
<head>
    <title>Types of CSS</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
            text-align: center;
        }
        
        p {
            font-size: 18px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <h2>Types of CSS</h2>

    <!-- Inline CSS -->
    <p style="color: red;">
        This is Inline CSS
    </p>

    <!-- Internal CSS -->
    <p>
        This is Internal CSS
    </p>

    <!-- External CSS -->
    <h3>This is External CSS</h3>

</body>
</html>

h3 {
    color: green;
    text-align: center;
    font-size: 22px;
}
