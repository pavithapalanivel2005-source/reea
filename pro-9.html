<html>
<head>
<title>Hide Paragraph</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<p id="p">Welcome to jQuery</p>
<button id="b">Hide</button>

<script>
$(document).ready(function(){
    $("#b").click(function(){
        $("#p").hide();
    });
});
</script>

</body>
</html>
